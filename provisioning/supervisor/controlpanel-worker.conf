; Install as /etc/supervisor/conf.d/controlpanel-worker.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start controlpanel-worker:*
; Runs as www-data so queued actions inherit the same (sudo-bridged) privileges
; as the web process. Requires QUEUE_CONNECTION=redis in the site's .env.
[program:controlpanel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/gemini/websites/ControlPanel/artisan queue:work redis --sleep=3 --tries=1 --timeout=900
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/home/gemini/websites/ControlPanel/storage/logs/worker.log
stopwaitsecs=920
